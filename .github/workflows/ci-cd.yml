name: Salesforce CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'force-app/**'
  push:
    branches: [ main ]
    paths:
      - 'force-app/**'

jobs:
  validate-or-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the source code
      - name: 'Checkout Source Code'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Node.js
      - name: 'Setup Node.js Environment'
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'

      # 3. Install Salesforce CLI (sf)
      - name: 'Install Salesforce CLI'
        run: |
          npm install -g @salesforce/cli
          sf --version

      # 4. Populate the JWT Secret Key file dynamically
      - name: 'Populate JWT Key'
        run: |
          echo "${{ secrets.SFDX_JWT_KEY }}" > server.key

      # 5. Authenticate to Salesforce Org using JWT
      - name: 'Authenticate to Salesforce Org'
        run: |
          sf org login jwt \
            --username ${{ secrets.SFDX_USERNAME }} \
            --jwt-key-file server.key \
            --client-id ${{ secrets.SFDX_CONSUMER_KEY }} \
            --instance-url ${{ secrets.SFDX_INSTANCE_URL }} \
            --set-default

      # 6. RUN VALIDATION ONLY (On Pull Request)
      - name: 'Validate Metadata (PR Only)'
        if: github.event_name == 'pull_request'
        run: |
          sf project deploy start \
            --source-dir force-app \
            --test-level RunLocalTests \
            --dry-run

      # 7. RUN ACTUAL DEPLOYMENT (On Merge/Push to Main)
      - name: 'Deploy Metadata to Org (Push Only)'
        if: github.event_name == 'push'
        run: |
          sf project deploy start \
            --source-dir force-app \
            --test-level RunLocalTests
